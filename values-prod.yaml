global:
  environment: production
  gateway:
    listenerName: prod
  userService:
    imageTag: "v2.0.4"
  medicalService:
    imageTag: "v2.0.2"
  healthService:
    imageTag: "v2.0.2"
  aiService:
    imageTag: "v2.0.2"
  frontend:
    imageTag: "v2.0.1"
  resourceQuota:
    requests:
      cpu: "8"
      memory: "12Gi"
    limits:
      cpu: "16"
      memory: "24Gi"
    pods: "60"
    services: "20"
    pvcs: "15"
